# Netlify: nur die Website-Dateien veröffentlichen (keine internen Dateien wie DESIGN.md, README.md, .claude)
[build]
  command = "rm -rf dist && mkdir dist && cp -r index.html impressum.html datenschutz.html danke.html 404.html robots.txt sitemap.xml assets dist/"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
